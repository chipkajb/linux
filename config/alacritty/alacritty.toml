[colors.bright]
black = "#928374"
blue = "#83a598"
cyan = "#8ec07c"
green = "#b8bb26"
magenta = "#d3869b"
red = "#fb4934"
white = "#ebdbb2"
yellow = "#fabd2f"

[colors.normal]
black = "#282828"
blue = "#458588"
cyan = "#689d6a"
green = "#98971a"
magenta = "#b16286"
red = "#cc241d"
white = "#a89984"
yellow = "#d79921"

[colors.primary]
background = "#282828"
foreground = "#ebdbb2"

[selection]
save_to_clipboard = true

# ctrl+backspace: send Ctrl+W (backward-kill-word in zsh/bash)
[[keyboard.bindings]]
key = "Backspace"
mods = "Control"
chars = "\u0017"

# ctrl+delete: send ESC d (kill-word forward in zsh/bash; <M-d> in nvim)
[[keyboard.bindings]]
key = "Delete"
mods = "Control"
chars = "\u001bd"

# ctrl+v: paste the system clipboard into this terminal
# Dictation tools (Wispr Flow) inject Ctrl+V, and only Alacritty can turn that into a
# paste. Alacritty inserts the clipboard text as ordinary input, so the transcript
# reaches the shell, nvim, a remote host over ssh, and any pane multiplexer. Without
# this, the Ctrl+V is forwarded as 0x16 and the far end never sees the text.
# Trade-off: ctrl+v no longer sends quoted-insert to the shell.
[[keyboard.bindings]]
key = "V"
mods = "Control"
action = "Paste"
