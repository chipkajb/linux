##########################################
# Picom Configuration File
# Tailored for a clean and modern look
##########################################

##########################################
# General Settings
##########################################
backend = "glx";  # Use OpenGL backend for better performance
vsync = true;     # Prevent screen tearing

##########################################
# Shadows
##########################################
shadow = true;
# An ambient shadow: no horizontal offset, a few pixels of drop. Reads as
# "floating" rather than as a hard cast to one side.
shadow-radius = 16;         # Blur radius for shadows
shadow-offset-x = 0;        # Horizontal offset
shadow-offset-y = 6;        # Vertical offset
shadow-opacity = 0.45;      # Opacity of shadows
# Wispr Flow overlay HUDs (the dictation pill, the Flow context menu) are
# larger than what they paint: the pill canvas is 512x614 with only a ~98x30
# pill drawn inside it. Blur, rounded corners and shadows all follow the
# window rect, so without these exclusions picom paints a big visible box.

shadow-exclude = [
    "class_g = 'i3bar'",    # Exclude i3bar
    "class_g = 'dmenu'",    # Exclude dmenu
    "window_type = 'dock'",
    "window_type = 'desktop'",
    "class_g = 'wispr-flow' && window_type = 'toolbar'",  # Wispr overlays
    "_GTK_FRAME_EXTENTS@:c" # Exclude client-side decorations
];

##########################################
# Transparency / Opacity
##########################################
inactive-opacity = 0.9;     # Transparency for inactive windows
active-opacity = 1.0;       # Full opacity for active windows
# The lock screen must be fully opaque. picom never sees the i3lock window as
# active, so inactive-opacity would render the desktop behind it at 10% and
# anyone walking by could read it. This rule wins over inactive-opacity.
opacity-rule = [
    "100:class_g = 'i3lock'"
];

##########################################
# Fading
##########################################
fading = true;
fade-in-step = 0.03;        # Speed of fade-in effects
fade-out-step = 0.03;       # Speed of fade-out effects
fade-delta = 5;             # Time between animation steps
fade-exclude = [
    "class_g = 'i3bar'",    # Exclude i3bar from fading
    "class_g = 'dmenu'",
    "class_g = 'i3lock'"    # Never fade the lock screen in: it would flash the desktop
];

##########################################
# Rounded Corners
##########################################
corner-radius = 12;         # Radius for rounded corners
rounded-corners-exclude = [
    "class_g = 'i3bar'",    # Exclude i3bar
    "class_g = 'dmenu'",
    "class_g = 'i3lock'",   # Rounded corners would expose the desktop corners
    "class_g = 'wispr-flow' && window_type = 'toolbar'"  # Wispr overlays
];

##########################################
# Blur
##########################################
# Windows are already translucent (inactive-opacity, dunst's transparency, any
# per-app opacity), so the blur has to be on for that transparency to read as
# frosted glass instead of as a washed-out window.
#
# Not covered: rofi. Its window is override-redirect and picom does not blur
# those, which is why the rofi card is opaque instead of glass.
#
# Geometry animations are left off on purpose — windows here are tiled and
# resize constantly, so sliding them around fights the layout.
blur-background = true;
blur-method = "dual_kawase";  # High-quality blur method
blur-strength = 6;            # Blur intensity
blur-background-exclude = [
    "class_g = 'i3bar'",      # Exclude i3bar from blur
    "class_g = 'dmenu'",
    "class_g = 'wispr-flow' && window_type = 'toolbar'",  # Wispr overlays
    "window_type = 'dock'",   # Exclude dock windows
    "window_type = 'desktop'" # Exclude desktop windows
];

##########################################
# Experimental Backends
##########################################
use-damage = true;          # Enable optimizations for fewer visual glitches
