# i3blocks configuration. Rendered by i3bar; see `man i3blocks` for the keys.
#
# Colours
#   Every block paints a neutral value colour until it crosses a threshold. The
#   helper scripts print the colour themselves, so the bar stays quiet until
#   something actually needs attention.
#
#     neutral  #d5c4a1   nothing to see
#     amber    #d79921   worth a glance
#     orange   #d65d0e   busy, act soon
#     red      #cc241d   critical
#
# Thresholds
#   Each script holds its own numbers. They are listed here so the whole bar can
#   be tuned without reading every script.
#
#   Each number is the point where that colour starts. Most metrics are worse as
#   they climb, so the colours step up with them. Wifi signal and battery charge
#   are worse as they fall, and those two are marked (falls).
#
#     volume         no colour, 0-100% is all normal
#     memory         amber 80%   orange 90%   red 95%   RAM in use
#     swap           amber 25%   orange 60%   red 90%   swap in use
#     disk           amber 80%   orange 90%   red 95%   filesystem full
#     iface          red while the interface is down
#     wifi (falls)   amber 80%   orange 60%   red 40%   signal quality
#     cpu_usage      amber 50%   orange 70%   red 90%   of all cores busy
#     temperature    amber 80    orange 90    red 98    deg C, CPU package
#     load_average   amber 50%   orange 100%  red 200%  of the core count
#     gpu_memory     amber 60%   orange 80%   red 92%   of VRAM in use
#     battery(falls) amber 50%   orange 30%   red 15%   charge, only while
#                                                      discharging
#     time           no colour
#
# Grouping
#   i3bar draws a hairline separator after every block whose `separator` is
#   true. Related blocks set `separator=false` so they read as one cluster.

# Blocks with no explicit command run the script of the same name installed by
# setup/i3.sh (config/i3/<name> is symlinked into /usr/share/i3blocks).
command=/usr/share/i3blocks/$BLOCK_NAME
separator_block_width=22
markup=none

# Volume, in 5% steps against the default PulseAudio sink.
[volume]
label=♪
instance=Master
interval=1
signal=10
color=#d5c4a1
command=/usr/share/i3blocks/volume 5 pulse

# Memory in use / swap in use, as one cluster. These two and [disk] call the
# repo scripts by path rather than the copies in /usr/share/i3blocks,
# because they change what the block reports rather than just fixing it.
[memory]
label=
interval=30
separator=false
color=#d5c4a1
command=$HOME/.config/i3/memory

[memory]
label=
instance=swap
interval=30
color=#d5c4a1
command=$HOME/.config/i3/memory

# Space in use on $HOME.
[disk]
label=
interval=30
color=#d5c4a1
command=$HOME/.config/i3/disk

# Default-route interface address, then Wi-Fi signal quality.
#
# Both emit their own icon: [iface] picks a wired or wireless glyph to match
# the link it is reporting, and [wifi] hides itself unless wifi is the link
# actually carrying traffic. Together they answer "which link am I on?", which
# a static globe plus an always-on wifi signal could not.
[iface]
interval=10
separator=false
color=#d5c4a1
command=$HOME/.config/i3/iface

[wifi]
interval=10
color=#d5c4a1
command=$HOME/.config/i3/wifi

# CPU busy / package temperature.
[cpu_usage]
label=
interval=10
separator=false
color=#d5c4a1

[temperature]
# `sensors` lists iwlwifi first on this machine, so the default (first)
# temp1_input reads the Wi-Fi card, not the CPU. Pin it to coretemp.
label=
interval=10
color=#d5c4a1
command=/usr/share/i3blocks/temperature --chip coretemp-isa-0000

# 1-minute load average, then GPU memory.
[load_average]
label=
interval=10
separator=false
color=#d5c4a1

[gpu_memory]
label=
interval=10
color=#d5c4a1

[battery]
# No label: the script emits a level icon (fa-battery-full .. empty).
interval=30
color=#d5c4a1

# Clock. 12-hour with seconds, and fixed-width (%l is space-padded) so the
# right-aligned status line never jitters as the digits change. The four
# trailing spaces are the right-hand margin: i3bar applies no padding after
# the last block, so on outputs without a systray the clock would otherwise
# sit flush against the screen edge.
[time]
command=date '+%a %d %b  %l:%M:%S %p    '
interval=1
color=#d5c4a1
