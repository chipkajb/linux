# herdr keybindings — optimized for learnability
# docs: https://herdr.dev/docs/configuration/
#
# Mental model (hjkl-first; arrows trimmed from help):
#   1) Tmux habits: Ctrl-Space, c/[ copy, t new tab, p/n tabs, l clear,
#      y yank, |/-/v/; splits, ctrl+hjkl panes, z zoom, x close, q detach
#   2) s = space: s new space, S rename space; t/T tab; P rename pane
#   3) Lowercase = everyday; Shift = rename, larger scope, or rarer sibling
#   4) Close ladder: x pane → X tab → d workspace
#   5) Sessions: prefix+j/k and ctrl+shift+j/k
#   6) Tabs: prefix+p/n and ctrl+shift+h/l
#   7) Panes: ctrl+hjkl (prefix+h left; prefix+l = clear)
#   8) Numbers: 1..9 tabs, Shift-1..9 workspaces, Alt-1..9 agents
#   9) Shift-Enter = scratch terminal; Shift-r = reload (r = resize)
#  10) Custom: a agent, G git (lazygit), Y yank, V reviewr, l clear

onboarding = false

[theme]
name = "catppuccin"

auto_switch = false
[terminal]
new_cwd = "follow"

[keys]
prefix = "ctrl+space"

# session / ui
help = "prefix+?"
settings = "prefix+i"
detach = "prefix+q"
reload_config = "prefix+shift+r"
toggle_sidebar = "prefix+b"
goto = "prefix+g"
workspace_picker = "prefix+w"

# workspaces / spaces (s = space)
new_workspace = "prefix+s"
rename_workspace = "prefix+shift+s"
close_workspace = "prefix+d"
new_worktree = "prefix+f"
open_worktree = "prefix+shift+f"
remove_worktree = "prefix+shift+d"
previous_workspace = ["prefix+k", "ctrl+shift+k"]
next_workspace = ["prefix+j", "ctrl+shift+j"]
switch_workspace = "prefix+shift+1..9"

# agents
previous_agent = "prefix+,"
next_agent = "prefix+."
focus_agent = "prefix+alt+1..9"

# tabs (tmux-ish; ctrl+shift+h/l = no-prefix tab hop)
new_tab = "prefix+t"
rename_tab = "prefix+shift+t"
previous_tab = ["prefix+p", "ctrl+shift+h"]
next_tab = ["prefix+n", "ctrl+shift+l"]
switch_tab = "prefix+1..9"
close_tab = "prefix+shift+x"

# panes (ctrl+hjkl; prefix+j/k = sessions; prefix+l = clear)
copy_mode = ["prefix+c", "prefix+["]
edit_scrollback = "prefix+e"
rename_pane = "prefix+shift+p"
focus_pane_left = ["prefix+h", "ctrl+h"]
focus_pane_down = "ctrl+j"
focus_pane_up = "ctrl+k"
focus_pane_right = "ctrl+l"
swap_pane_left = "prefix+shift+h"
swap_pane_down = "prefix+shift+j"
swap_pane_up = "prefix+shift+k"
swap_pane_right = "prefix+shift+l"
last_pane = "prefix+o"
split_vertical = ["prefix+|", "prefix+;"]
split_horizontal = ["prefix+minus", "prefix+v"]
close_pane = "prefix+x"
zoom = "prefix+z"
resize_mode = "prefix+r"
cycle_pane_next = "prefix+tab"
cycle_pane_previous = "prefix+shift+tab"

# navigate-mode (j/k = sessions; h/l + shift+j/k = panes;
# left/right arrows are permanent pane aliases; j/k can't bind both)
navigate_workspace_up = "k"
navigate_workspace_down = "j"
navigate_pane_left = "h"
navigate_pane_down = "shift+j"
navigate_pane_up = "shift+k"
navigate_pane_right = "l"

# --- custom commands -------------------------------------------------------

# tmux: prefix+l clear (HERDR_BIN_PATH — shell cmds use /bin/sh -lc, not zsh PATH)
[[keys.command]]
key = "prefix+l"
type = "shell"
command = '"$HERDR_BIN_PATH" pane send-keys "$HERDR_ACTIVE_PANE_ID" ctrl+l'
description = "clear pane"

# prefix+y yank pane (herdr reads OSC 52 from pane output; xclip fails over SSH)
[[keys.command]]
key = "prefix+y"
type = "shell"
command = "\"$HERDR_BIN_PATH\" pane read \"$HERDR_ACTIVE_PANE_ID\" --source recent-unwrapped 2>/dev/null | \"$HOME/.local/bin/osc52-copy\""
description = "copy pane to clipboard"

# a = Cursor agent
[[keys.command]]
key = "prefix+a"
type = "pane"
command = "agent"
description = "cursor agent"

# A = Claude Code
[[keys.command]]
key = "prefix+shift+a"
type = "pane"
command = "claude"
description = "claude code"

# G = git
[[keys.command]]
key = "prefix+shift+g"
type = "popup"
command = "lazygit"
description = "lazygit"
width = "90%"
height = "90%"

# Shift-Enter = scratch terminal (i3 "new terminal" muscle memory)
[[keys.command]]
key = "prefix+shift+enter"
type = "popup"
command = 'exec "${SHELL:-zsh}"'
description = "scratch terminal"
width = "80%"
height = "80%"

# V = reView (herdr-reviewr sidebar)
[[keys.command]]
key = "prefix+shift+v"
type = "plugin_action"
command = "persiyanov.reviewr.toggle"
description = "toggle reviewr"

[ui]
sidebar_width = 26
prompt_new_tab_name = false

show_agent_labels_on_pane_borders = false
agent_panel_sort = "spaces"
[ui.toast]
delivery = "system"

[worktrees]
directory = "~/.herdr/worktrees"

[session]
resume_agents_on_restore = true

[ui.sound]
enabled = false

[experimental]
pane_history = false
