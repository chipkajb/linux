# set true color
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
set -ga terminal-overrides ",xterm-256color:Tc"
set -g focus-events on
set -g set-clipboard on

# set mouse control (also enforced by jmux core)
set -g mouse on

# prefix: Ctrl-Space (jmux intercepts are patched via scripts/patch-jmux.sh
# so palette / new-session / diff / settings also use Ctrl-Space)
unbind C-b
unbind C-a
set -g prefix C-Space
bind C-Space send-prefix

# shift-alt vim keys to switch windows
bind -n M-H previous-window
bind -n M-L next-window

# start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'dreamsofcode-io/catppuccin-tmux'
set -g @plugin 'tmux-plugins/tmux-yank'

# set vi-mode
set-window-option -g mode-keys vi

# copy-mode on prefix+c (overrides jmux default "new window" on c)
# new window moves to prefix+t (tabs in the jmux toolbar)
bind-key c copy-mode
bind-key [ copy-mode
bind-key t new-window -c "#{pane_current_path}"
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind-key l send-keys -R C-c

# use mouse to copy
bind -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'select-pane -t=; copy-mode -e; send-keys -M'"
bind -n WheelDownPane select-pane -t= \; send-keys -M
bind -n C-WheelUpPane select-pane -t= \; copy-mode -e \; send-keys -M
bind -T copy-mode-vi    C-WheelUpPane   send-keys -X halfpage-up
bind -T copy-mode-vi    C-WheelDownPane send-keys -X halfpage-down
bind -T copy-mode-emacs C-WheelUpPane   send-keys -X halfpage-up
bind -T copy-mode-emacs C-WheelDownPane send-keys -X halfpage-down

# Update default binding of Enter to also use copy-pipe
unbind -T copy-mode-vi Enter
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "xclip -selection c"
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "xclip -in -selection clipboard"

# panes: keep jmux defaults (| / -) and familiar aliases (v / ;)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind v split-window -v -c "#{pane_current_path}"
bind \; split-window -h -c "#{pane_current_path}"

# override jmux default copy-pane binding (pbcopy) for Linux
bind y run-shell "tmux capture-pane -pS - -E - | grep . | xclip -selection clipboard" \; display-message "Copied pane to clipboard"

# move between panes (jmux also provides Shift-Arrow navigation)
bind-key -n C-h select-pane -L
bind-key -n C-j select-pane -D
bind-key -n C-k select-pane -U
bind-key -n C-l select-pane -R

# run
run '~/.tmux/plugins/tpm/tpm'
